<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Store</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header id="main-header">
        <nav class="container nav-bar">
            <div class="logo" onclick="router.navigate('home')">CardSlinger</div>
            <div class="nav-links">
                <a href="#" onclick="router.navigate('catalog')">Каталог</a>
                <a href="#" onclick="router.navigate('cart')">Корзина</a>
                <a href="#" onclick="router.navigate('favorites')">Избранное</a>
            </div>
            <div id="auth-zone">
               <button class="button" onclick="router.navigate('login')">Войти</button>
            </div>
        </nav>
    </header>

    <main id="app-content" class="container">
        
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Контакты: +7 (999) 000-00-00 | email: support@store.com</p>
        </div>
    </footer>

    <script src="./auth.js"></script> 
    <script src="./views.js"></script>
    <script src="./app.js"></script>


    <div id="adminModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close-modal" onclick="closeAdminModal()">&times;</span>
    <h3 id="modalTitle">Edit</h3>
    <form id="modalForm" onsubmit="saveAdminForm(event)">
      <div id="modalFields"></div>
      <button type="submit" class="btn">Save</button>
    </form>
  </div>
</div>
    
</body>
</html>
